{% extends "base.html" %}

{% block title %}Sign in — Avril W. Hsu{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Sign in</h1>
        <p class="auth-subtitle">Continue to AI companion</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <div class="auth-providers">
            {% if google_client_id %}
            <div id="g_id_onload"
                 data-client_id="{{ google_client_id }}"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleGoogleSignIn"
                 data-auto_prompt="false"></div>
            <div class="g_id_signin auth-google"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="continue_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="320"></div>
            {% else %}
            <button type="button" class="google-btn" onclick="googleNotConfigured()">
                <svg viewBox="0 0 48 48" class="google-icon" width="20" height="20" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
            {% endif %}
        </div>

        <div class="auth-divider"><span>or</span></div>

        <form method="post" action="{{ url_for('sign_in', next=next_url) }}" class="auth-form">
            <label>
                Email
                <input type="email" name="email" required autocomplete="email">
            </label>
            <label>
                Password
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </div>
</div>

{% if google_client_id %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    function handleGoogleSignIn(response) {
        const formData = new FormData();
        formData.append('credential', response.credential);
        formData.append('next', {{ next_url|tojson }});
        fetch('/auth/google', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else if (data.error) {
                    alert(data.error);
                }
            })
            .catch(() => alert('Sign-in failed. Please try again.'));
    }
</script>
{% else %}
<script>
    function googleNotConfigured() {
        alert(
            "Google Sign-In isn't configured yet.\n\n" +
            "To enable:\n" +
            "1. Create an OAuth client ID at https://console.cloud.google.com/apis/credentials\n" +
            "2. Add http://127.0.0.1:5000 as an authorized origin\n" +
            "3. Restart the server with GOOGLE_CLIENT_ID set:\n" +
            '   GOOGLE_CLIENT_ID="..." python app.py'
        );
    }
</script>
{% endif %}
{% endblock %}
